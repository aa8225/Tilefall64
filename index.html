<!DOCTYPE html>
<!--

  (c) 2026 AA Software Ltd. All rights reserved.

  The page that holds the game. The game is drawn by game.js on the
  <canvas>; styles.css handles the look of everything around it.

  Third-party parts (both free to use):
    lib/qrcode.js  QR code generator (c) Kazuhiko Arase, MIT licence
    fonts/         Press Start 2P font (c) 2012 The Press Start 2P Project
                   Authors, SIL Open Font Licence 1.1
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Tilefall 64 – AA Software Ltd</title>
    <meta name="description" content="Tilefall 64: an 8-bit tile-catching arcade game by AA Software Ltd." />
    <meta name="author" content="AA Software Ltd" />
    <meta name="theme-color" content="#02140d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tilefall 64" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Link preview for LinkedIn, Facebook, WhatsApp, X -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tilefall 64 – AA Software Ltd" />
    <meta property="og:description" content="An 8-bit tile-catching arcade game. Tap to play, no download needed." />
    <meta property="og:url" content="https://aa8225.github.io/Tilefall64/" />
    <meta property="og:image" content="https://aa8225.github.io/Tilefall64/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tilefall 64 by AA Software Ltd: an 8-bit arcade game" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Makes the game installable as an app with its own icon -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header: game title and small option buttons -->
      <header>
        <h1>TILEFALL 64</h1>
        <div class="tb">
          <button id="bMus" aria-label="Toggle music">MUSIC ON</button>
          <button id="bBg" aria-label="Change scene">SCENE</button>
          <button id="bPause" aria-label="Pause">PAUSE</button>
          <button id="bShare" aria-label="Share the game">SHARE</button>
        </div>
      </header>

      <!-- The game screen: a 180x320 canvas scaled up inside a monitor bezel,
           with a scanline overlay on top -->
      <div id="screen">
        <div id="wrap">
          <canvas id="c" width="180" height="320"></canvas>
          <div class="scan"></div>
        </div>
      </div>

      <!-- Share panel, hidden until SHARE is tapped -->
      <div id="share" hidden role="dialog" aria-label="Share Tilefall 64">
        <div class="card">
          <h2>SHARE<br />TILEFALL 64</h2>
          <div id="qr"></div>
          <p class="hint">SCAN WITH A PHONE CAMERA</p>
          <p id="surl"></p>
          <div class="row">
            <button id="bSend">SEND</button>
            <button id="bCopy">COPY LINK</button>
          </div>
          <button id="bInstall">INSTALL ON THIS DEVICE</button>
          <p id="itext" class="hint" hidden></p>
          <button id="bClose">CLOSE</button>
        </div>
      </div>

      <!-- On-screen controls: left thumb moves, right thumb acts -->
      <div id="pad">
        <button id="bL" aria-label="Move left"><svg viewBox="0 0 10 10"><path d="M7 1v8L2 5z" /></svg></button>
        <button id="bR" aria-label="Move right"><svg viewBox="0 0 10 10"><path d="M3 1v8l5-4z" /></svg></button>
        <button id="bToss">TOSS</button>
        <button id="bDrop">DROP</button>
      </div>
    </div>

    <!-- QR code generator first, then the game -->
    <script src="lib/qrcode.js"></script>
    <script src="game.js"></script>
    <!-- Offline play and automatic updates (only on a real https website) -->
    <script>
      if ("serviceWorker" in navigator && location.protocol === "https:")
        navigator.serviceWorker.register("sw.js").catch(() => {});
    </script>
  </body>
</html>
