 </div>

var qrcode = function() {

  // qrcode

  /**

   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

    var _moduleCount = 0;

    var _dataList = [];

    var makeImpl = function(test, maskPattern) {

          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {

          }

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

        setupTypeNumber(test);
      }

      if (_dataCache == null) {

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {

          } else {
            _modules[row + r][col + c] = false;
          }

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {

          pattern = i;
        }

      return pattern;

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

        } else {
          _modules[8][15 - i - 1] = mod;

                bitIndex = 7;

          if (row < 0 || _moduleCount <= row) {

      var maxDcCount = 0;
      var maxEcCount = 0;

          + totalDataCount * 8

        buffer.put(0, 4);

        buffer.putBit(false);

      // padding

        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);

      case 'Alphanumeric' :

        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :

      _dataList.push(newData);
      _dataCache = null;
    };

      return _modules[row][col];

            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {

            break;
          }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );

      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        for (var c = 0; c < _this.getModuleCount(); c += 1) {

          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';

      qrHtml += '</table>';

      return createDataURL(size, size, function(x, y) {

      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {

        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;

bInstall.addEventListener('click',()=>{if(dip){dip.prompt();dip.userChoice&&dip.userChoice.then(()=>{dip=null});return}
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 itext.textContent=(inFrame?'OPEN THE LINK IN '+(ios?'SAFARI':'CHROME')+' FIRST. THEN ':'')+(ios?'TAP THE SHARE ICON, THEN ADD TO HOME SCREEN.':'TAP THE BROWSER MENU, THEN INSTALL APP OR ADD TO HOME SCREEN.');itext.hidden=false});
$('bClose').addEventListener('click',()=>{shareEl.hidden=true});
addEventListener('keydown',e=>{if(e.key==='Escape')shareEl.hidden=true});
let ps=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();ps={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointerup',e=>{if(!ps)return;const dx=e.clientX-ps.x,dy=e.clientY-ps.y;ps=null;
 if(S.state==='entry'){if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))act(dx<0?'L':'R');else if(dy<-30)act('R');else if(dy>30)act('L');else act('D');return}
 if(S.state!=='play'&&S.state!=='intro'){act('tap');bPause.textContent='PAUSE';return}
 if(dy<-30&&Math.abs(dy)>Math.abs(dx)){act('T');return}
 if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy)){act(dx<0?'L':'R');return}
 const r=cv.getBoundingClientRect(),ix=(e.clientX-r.left)/r.width*W,l=Math.max(0,Math.min(4,Math.floor((ix-15)/30)));
 if(l===S.lane)act('D');else setLane(l)});
addEventListener('keydown',e=>{const k={ArrowLeft:'L',ArrowRight:'R',ArrowDown:'D',' ':'D',ArrowUp:'T',Enter:'tap'}[e.key];
 if(S.state==='entry'&&/^[a-z]$/i.test(e.key)){S.ini[S.pos]=e.key.toUpperCase();act('D');return}if(S.state==='entry'&&e.key==='Backspace'){act('T');return}
 if(e.key==='p'||e.key==='P'){if(S.state==='pause')resume();else pause();return}if(k){e.preventDefault();unlock();act(k)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();bPause.textContent='PLAY'}});
const scr=document.getElementById('screen'),wrap=document.getElementById('wrap');
function fit(){const r=scr.getBoundingClientRect();let s=Math.min(r.width/W,r.height/H);if(s>=2)s=Math.floor(s*4)/4;s=Math.max(.5,s);wrap.style.width=Math.floor(W*s)+'px';wrap.style.height=Math.floor(H*s)+'px'}
const ro=new ResizeObserver(fit);ro.observe(scr);fit();
ctx.imageSmoothingEnabled=false;buildBg();
if(document.fonts&&document.fonts.load)document.fonts.load('8px "Press Start 2P"').catch(()=>{});
requestAnimationFrame(loop);
}
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
